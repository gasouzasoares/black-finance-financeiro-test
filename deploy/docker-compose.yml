name: finance-platform

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: finance-platform-app:0.1.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks: [backend]
  logging: *logging
  stop_grace_period: 40s

services:
  api:
    <<: *app
    command: [node, dist/apps/api/src/main.js]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL com app_runtime}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Configure SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY}
      JWT_ISSUER: ${JWT_ISSUER:?Configure JWT_ISSUER}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: [node, dist/apps/worker/src/main.js]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL com app_runtime}
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/worker-heartbeat','utf8'))<75000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: finance-platform-web:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:2015/live]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
