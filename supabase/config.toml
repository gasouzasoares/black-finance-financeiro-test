project_id = "finance-platform-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[storage.vector]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://127.0.0.1:8080", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
signing_keys_path = "./signing_keys.json"

[auth.email]
# Enables the email provider; public registration stays disabled in [auth].
enable_signup = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
